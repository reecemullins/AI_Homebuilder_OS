version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:16-3.4
    container_name: builderos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: builderos
      POSTGRES_PASSWORD: builderos_dev
      POSTGRES_DB: builderos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U builderos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: builderos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Meilisearch (Search)
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: builderos-meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: builderos_search_key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  # API Server (development)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: builderos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://builderos:builderos_dev@postgres:5432/builderos
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules

  # Worker (background jobs)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: builderos-worker
    restart: unless-stopped
    command: npm run start:worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://builderos:builderos_dev@postgres:5432/builderos
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/api/node_modules

  # Web Frontend (development)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: builderos-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/apps/web/.next

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
